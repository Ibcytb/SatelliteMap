<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SatelliteMap</title>
  <link rel="icon" href="favicon.svg?v=mono-1" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=mono-1">
</head>
<body>
<main class="shell">
  <p id="status" role="status" hidden></p>
  <div class="workspace">
    <section class="viewer" aria-label="지도 미리보기">
      <div class="viewer-tools">
        <div class="tabs" role="tablist" aria-label="미리볼 지도">
          <button id="tab-land" role="tab" aria-selected="false" aria-controls="map-stage" data-preview="land">육지</button>
          <button id="tab-water" role="tab" aria-selected="true" aria-controls="map-stage" data-preview="water">바다·물</button>
        </div>
        <div class="backgrounds" role="group" aria-label="미리보기 배경">
          <button class="swatch check" data-bg="check" aria-label="체크무늬 배경" aria-pressed="true"></button>
          <button class="swatch white" data-bg="white" aria-label="흰 배경" aria-pressed="false"></button>
          <button class="swatch black" data-bg="black" aria-label="검정 배경" aria-pressed="false"></button>
        </div>
      </div>
      <div class="map-stage" id="map-stage" role="tabpanel" aria-labelledby="tab-water" data-bg="check">
        <img id="preview-land" src="assets/land.png" alt="육지 지도" draggable="false" hidden>
        <img id="preview-water" src="assets/water.png" alt="바다와 내륙 수역 지도" draggable="false">
        <div class="zoom">
          <button id="zoom-out" aria-label="지도 축소">−</button>
          <button id="zoom-in" aria-label="지도 확대">+</button>
          <button id="zoom-reset" aria-label="확대 초기화">1:1</button>
        </div>
      </div>
    </section>
    <section class="controls" aria-label="다운로드 설정">
      <fieldset>
        <legend>지도</legend>
        <div class="layer-options">
          <button data-layer="land" aria-pressed="false">육지</button>
          <button data-layer="water" aria-pressed="true">바다·물</button>
          <button data-layer="both" aria-pressed="false">둘 다</button>
        </div>
      </fieldset>
      <fieldset>
        <legend>크기</legend>
        <div class="series" role="group" aria-label="크기 종류">
          <button data-series="standard" aria-pressed="true">기본</button>
          <button data-series="thousands" aria-pressed="false">1,000px 단위</button>
        </div>
        <div class="preset-grid" role="group" aria-label="크기 프리셋"></div>
        <label class="sr-only" for="size">크기 입력</label>
        <div class="size-input">
          <input id="size" type="number" min="512" max="65536" step="1" value="4096" aria-describedby="size-error">
          <span>× <span id="mirror-size">4,096</span> px</span>
        </div>
        <p id="size-error" role="alert" hidden></p>
      </fieldset>
      <div class="output"><span id="output-size">4,096 × 4,096 px</span><span id="file-bytes">—</span></div>
      <button id="export" class="download-button" disabled>PNG 다운로드 <span aria-hidden="true">↓</span></button>
      <div id="jobs" class="jobs" aria-live="polite" hidden></div>
    </section>
  </div>
  <details class="library">
    <summary>전체 크기</summary>
    <div class="library-inner">
      <label class="sr-only" for="catalog-search">크기 검색</label>
      <input id="catalog-search" type="search" placeholder="크기 검색" inputmode="numeric">
      <div class="table-wrap"><table><thead><tr><th scope="col">px</th><th scope="col">육지</th><th scope="col">바다·물</th></tr></thead><tbody id="catalog-rows"></tbody></table></div>
    </div>
  </details>
  <footer><a href="https://github.com/Ibcytb/SatelliteMap">GitHub</a><a href="SHA256SUMS.txt" download>SHA-256</a></footer>
</main>
<script src="catalog.js"></script>
<script src="app.js?v=mono-1"></script>
</body>
</html>
