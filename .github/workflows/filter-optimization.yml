name: Optimize combined PNG filters
on:
  workflow_dispatch:
    inputs:
      staging_id:
        description: Private combined-staging Release ID
        type: number
        required: true
permissions:
  contents: write
concurrency:
  group: combined-strong-compression
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      upload_url: ${{ steps.plan.outputs.upload_url }}
      land_source: ${{ steps.plan.outputs.land_source }}
      water_source: ${{ steps.plan.outputs.water_source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the private temporary Release
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ID: ${{ inputs.staging_id }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$STAGING_ID" --jq '.draft == true and (.tag_name | startswith("combined-staging-"))')" = true
      - run: pip install -r tools/requirements.txt Pillow
      - name: Verify all seven filter strategies preserve RGB
        run: python -m unittest discover -s tools -p test_filter_optimization.py
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ID: ${{ inputs.staging_id }}
        run: python tools/strong_combined.py plan
  optimize:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Optimize filters ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Build and test the lossless bitstream compressor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libzopfli-dev
          cc -O3 tools/zopfli_block.c -lzopfli -o tools/zopfli-block
          python tools/strong_combined.py self-test
      - name: Measure filters and retain the smallest verified blocks
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ID: ${{ inputs.staging_id }}
          LAND_SOURCE_URL: ${{ needs.plan.outputs.land_source }}
          WATER_SOURCE_URL: ${{ needs.plan.outputs.water_source }}
          SHARD_INDEX: ${{ matrix.index }}
          UPLOAD_URL: ${{ needs.plan.outputs.upload_url }}
        run: python tools/optimize_filters.py shard
  assemble:
    needs: [plan,optimize]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Validate and publish two single PNG files
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ID: ${{ inputs.staging_id }}
        run: python tools/optimize_filters.py assemble
      - name: Remove temporary compression data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/${{ inputs.staging_id }}"
