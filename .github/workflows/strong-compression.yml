name: Optimize large combined PNGs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combined-strong-compression
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      upload_url: ${{ steps.plan.outputs.upload_url }}
      staging_id: ${{ steps.staging.outputs.id }}
      land_source: ${{ steps.plan.outputs.land_source }}
      water_source: ${{ steps.plan.outputs.water_source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="combined-staging-$GITHUB_RUN_ID" -f target_commitish="$GITHUB_SHA" -F draft=true --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ID: ${{ steps.staging.outputs.id }}
        run: |
          pip install -r tools/requirements.txt
          python tools/strong_combined.py plan

  compress:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Lossless shard ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Build bounded-memory compressor and verify bitstream joining
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libzopfli-dev
          cc -O3 tools/zopfli_block.c -lzopfli -o tools/zopfli-block
          python tools/strong_combined.py self-test
      - name: Compress two native-resolution map shards
        env:
          GH_TOKEN: ${{ github.token }}
          LAND_SOURCE_URL: ${{ needs.plan.outputs.land_source }}
          WATER_SOURCE_URL: ${{ needs.plan.outputs.water_source }}
          SHARD_INDEX: ${{ matrix.index }}
          UPLOAD_URL: ${{ needs.plan.outputs.upload_url }}
        run: python tools/strong_combined.py shard

  assemble:
    needs: [plan, compress]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Join, validate and publish two single PNG files
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ID: ${{ needs.plan.outputs.staging_id }}
        run: python tools/strong_combined.py assemble
      - name: Remove temporary compression shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/${{ needs.plan.outputs.staging_id }}"
